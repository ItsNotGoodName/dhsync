# yaml-language-server: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create:
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set version
        run: |
          echo "VERSION=$(git tag --points-at HEAD)" >> $GITHUB_ENV

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --draft --generate-notes --target $GITHUB_SHA $VERSION

  build:
    needs: [create]
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          echo "VERSION=$(git tag --points-at HEAD)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Build release
        run: 
          task release

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $VERSION dist/artifacts/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish docker release
        run: docker buildx build . -f Dockerfile -t ghcr.io/itsnotgoodname/dhsync:latest -t ghcr.io/itsnotgoodname/dhsync:$VERSION --provenance=false --platform=linux/amd64,linux/arm/v7,linux/arm64/v8 --push
